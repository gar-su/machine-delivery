<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机器投放 · 后台原型</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --border:#e5e7eb; --text:#1f2937; --muted:#6b7280;
    --primary:#2563eb; --primary-hover:#1d4ed8; --green:#16a34a; --red:#dc2626;
    --amber:#d97706; --blue-bg:#eff6ff; --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:100}
  .logo{font-weight:700;font-size:16px;margin-right:16px}
  .breadcrumb{color:var(--muted);font-size:13px}
  .outer-tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--border);padding:0 24px}
  .outer-tab{padding:14px 18px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
  .outer-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .inner-tabs{display:flex;gap:4px;padding:12px 24px 0}
  .inner-tab{padding:8px 16px;cursor:pointer;color:var(--muted);border-radius:var(--radius) var(--radius) 0 0;background:transparent}
  .inner-tab.active{color:var(--primary);background:#fff;font-weight:500;border:1px solid var(--border);border-bottom:1px solid #fff}
  .content{padding:20px 24px}
  .page{display:none}
  .page.active{display:block}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .card h3{font-size:14px;margin-bottom:12px}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
  .filters label{font-size:13px;color:var(--muted)}
  .filters input,.filters select,.filters button{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .filters .date-input{width:140px}
  .filters .kw-input{width:260px}
  .filters button.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);cursor:pointer}
  .filters button.reset{background:#fff;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{background:#fafafa;color:var(--muted);font-weight:500;white-space:nowrap}
  tr:hover td{background:#fafbfc}
  .tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500}
  .tag-green{background:#dcfce7;color:var(--green)}
  .tag-red{background:#fee2e2;color:var(--red)}
  .tag-amber{background:#fef3c7;color:var(--amber)}
  .tag-blue{background:var(--blue-bg);color:var(--primary)}
  .tag-gray{background:#f3f4f6;color:var(--muted)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .stat .num{font-size:26px;font-weight:700;margin:6px 0 2px}
  .stat .label{font-size:12px;color:var(--muted)}
  .link{color:var(--primary);cursor:pointer;text-decoration:none}
  .link:hover{text-decoration:underline}
  .btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;margin-right:6px}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.success{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
  .btn.warning{background:#fff;color:var(--amber);border-color:var(--amber)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:12px;width:560px;max-width:92vw;max-height:88vh;overflow:auto;padding:24px}
  .modal h2{font-size:16px;margin-bottom:16px}
  .form-row{margin-bottom:14px}
  .form-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .form-row .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .section-title{font-size:14px;font-weight:600;margin:16px 0 10px}
  .badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:4px}
  .badge-num{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:6px;vertical-align:top}
  .alert-card{border-left:3px solid var(--amber)}
  .reason{color:var(--muted);font-size:12px}
  .status-building{background:var(--blue-bg);color:var(--primary)}
  .status-running{background:#e0e7ff;color:#4338ca}
  .status-done{background:#dcfce7;color:var(--green)}
  .status-fail{background:#fee2e2;color:var(--red)}
  .status-skip{background:#f3f4f6;color:var(--muted)}
  .status-warn{background:#fef3c7;color:var(--amber)}
  .st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .st-dot.s-ok{background:var(--green)}
  .st-dot.s-ing{background:var(--amber)}
  .st-dot.s-fail{background:var(--red)}
  .st-dot.s-partial{background:var(--amber)}
  .st-dot.s-skip{background:#9ca3af}
  .st-dot.s-pause{background:#6b7280}
  .st-dot.s-none{background:transparent;border:1px dashed #d1d5db}
  .st-txt{font-size:12px;color:var(--text)}
  .st-txt.s-ok{color:var(--green)}
  .st-txt.s-ing{color:var(--amber)}
  .st-txt.s-fail{color:var(--red)}
  .st-txt.s-partial{color:var(--amber)}
  .st-txt.s-skip{color:var(--muted)}
  .st-txt.s-pause{color:var(--muted)}
  .st-txt.s-none{color:#d1d5db}
  .cell-muted{color:#d1d5db}
  .batch-label{font-size:13px;color:var(--muted)}
  .cl-checkbox,.cl-checkbox-all{cursor:pointer}
  .batch-schedule{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .batch-form{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
  .batch-form-title{font-size:13px;font-weight:600;color:var(--text)}
  .batch-form-field{display:flex;align-items:center;gap:10px}
  .batch-form-field label{font-size:13px;color:var(--muted);white-space:nowrap}
  .batch-form-actions{display:flex;gap:10px}
  .ss-wrap{position:relative;min-width:150px}
  .ss-input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}
  .ss-input:focus{outline:none;border-color:var(--primary)}
  .ss-list{position:absolute;top:100%;left:0;right:0;z-index:50;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.08);max-height:200px;overflow:auto;display:none}
  .ss-wrap.ss-open .ss-list{display:block}
  .ss-opt{padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ss-opt:hover,.ss-opt.cur{background:var(--blue-bg);color:var(--primary)}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">机器投放</div>
  <div class="breadcrumb">后台 / <span id="crumb">执行记录</span></div>
</div>
<div class="outer-tabs">
  <div class="outer-tab active" data-outer="dashboard">运行看板</div>
  <div class="outer-tab" data-outer="dramas">测新清单</div>
  <div class="outer-tab" data-outer="tasks">默认自动化任务</div>
</div>

<!-- 运行看板 -->
<div class="outer-page" id="outer-dashboard">
  <div class="inner-tabs">
    <div class="inner-tab active" data-page="records">执行记录</div>
  </div>
  <div class="content">
    <div class="page active" id="page-records">
      <div class="filters">
        <label>信号类型</label>
        <select id="recType"><option value="">全部</option><option>测新</option><option>跟投</option></select>
        <label>维度</label>
        <select id="recDim"><option value="">全部</option><option>短剧</option><option>广告计划</option><option>素材</option></select>
        <label>目标</label>
        <input id="recKw" class="kw-input" placeholder="短剧名 / 剧本编号 / 计划ID / 素材ID">
        <label>操作人</label>
        <select id="recUser"><option value="">全部</option><option>系统</option><option>运营A</option><option>运营B</option><option>运营C</option></select>
        <label>时间范围</label>
        <input type="date" class="date-input" id="recDate1"><span style="color:var(--muted)">至</span><input type="date" class="date-input" id="recDate2">
        <button class="btn-primary" onclick="renderRecords()">查询</button>
        <button class="reset" onclick="resetRecords()">重置</button>
      </div>
      <table>
        <thead><tr><th>信号ID</th><th>类型</th><th>维度</th><th>目标</th><th>自动化任务ID</th><th>操作人</th><th>运行</th><th>时间</th></tr></thead>
        <tbody id="recTableBody"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- 测新清单 -->
<div class="outer-page" id="outer-dramas" style="display:none">
  <div class="content">
    <div class="filters">
      <label>语言</label>
      <select id="drLang">
        <option value="">全部</option><option>中文</option><option>英语</option><option>韩语</option><option>泰语</option><option>马来语</option>
      </select>
      <label>短剧</label><input id="drKw" class="kw-input" placeholder="搜索短剧名或剧本编号，如「霸总」或「LA001」">
      <button class="btn-primary" onclick="renderDramaTable()">查询</button>
    </div>
    <div class="batch-form">
      <div class="batch-form-title">批量发起测新 · 已选 <b id="drSelCount">0</b> 部短剧</div>
      <div class="batch-form-field" style="font-size:12px;color:var(--muted)">新上线短剧由 NEW_DRAMA_ONLINE 信号提醒进入；勾选短剧后「发起测新」，弹窗展示默认自动化任务配置并设统一排期，确认后按语种绑定并进入执行记录查看结果</div>
      <div class="batch-form-actions">
        <button class="btn success" onclick="batchInitiateTest()">批量发起测新</button>
      </div>
    </div>
    <table>
      <thead><tr><th><input type="checkbox" class="dr-checkbox-all"></th><th>剧本编号</th><th>剧本名</th><th>短剧名</th><th>语言</th><th>上线状态</th></tr></thead>
      <tbody id="drTable"></tbody>
    </table>
    <div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px">
      <span id="drPagerInfo" style="color:var(--muted);font-size:13px"></span>
      <button class="btn" id="drPrev" onclick="drPrev()">上一页</button>
      <button class="btn" id="drNext" onclick="drNext()">下一页</button>
      <label style="font-size:13px;color:var(--muted)">每页</label>
      <select id="drPageSize" onchange="setDrPageSize(this.value)">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
      <span style="font-size:13px;color:var(--muted)">条</span>
    </div>
  </div>
</div>

<!-- 默认自动化任务 -->
<div class="outer-page" id="outer-tasks" style="display:none">
  <div class="content">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">测新默认自动化任务</h3>
        <button class="btn primary" onclick="openAddTask()">新增配置</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">已覆盖的语种禁止重复新增</div>
      <table>
        <thead><tr><th>语种</th><th>绑定 Meta 自动化任务</th><th>绑定 TikTok 自动化任务</th><th>操作</th></tr></thead>
        <tbody id="taskTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 新增测新默认配置 -->
<div class="modal-mask" id="taskMask">
  <div class="modal">
    <h2 id="taskModalTitle">新增测新默认配置</h2>
    <div class="form-row">
      <label>语种（已配置语种不可重复新增）</label>
      <select id="addLang"></select>
    </div>
    <div class="form-row">
      <label>绑定 Meta 自动化任务</label>
      <div id="addMeta"></div>
    </div>
    <div class="form-row">
      <label>绑定 TikTok 自动化任务</label>
      <div id="addTT"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAddTask()">取消</button>
      <button class="btn primary" onclick="confirmAddTask()">保存</button>
    </div>
  </div>
</div>

<!-- 清单详情弹窗 -->
<div class="modal-mask" id="detailMask">
  <div class="modal">
    <h2>测新确认</h2>
    <div class="form-row">
      <label>本次批量发起测新</label>
      <div>已选 <b id="detailCount">0</b> 部短剧：<span id="detailDramas"></span></div>
    </div>
    <div class="form-row">
      <label>默认自动化任务配置（本批短剧按各自语种自动绑定对应任务）</label>
      <div id="detailTasks" style="overflow-x:auto"></div>
    </div>
    <div class="form-row">
      <label>排期（东八区，对本批所有短剧生效）</label>
      <input type="datetime-local" id="detailSchedule" value="2026-08-15T10:00">
      <div class="hint">留空表示立即执行；排期作为参数到点执行，预上线短剧建议设置</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="cancelBatch()">取消</button>
      <button class="btn primary" onclick="confirmBatch()">通过并绑定</button>
    </div>
  </div>
</div>


<script>
// 外层 Tab
const crumbNames={dashboard:'执行记录',dramas:'测新清单',tasks:'默认自动化任务'};
document.querySelectorAll('.outer-tab').forEach(t=>{
  t.addEventListener('click',()=>switchOuter(t.dataset.outer));
});
function switchOuter(o){
  document.querySelectorAll('.outer-tab').forEach(x=>x.classList.toggle('active',x.dataset.outer===o));
  document.querySelectorAll('.outer-page').forEach(p=>{p.style.display=p.id==='outer-'+o?'block':'none';});
  document.getElementById('crumb').textContent=crumbNames[o]||'';
}
// 内层 Tab（运行看板仅执行记录）
document.querySelectorAll('.inner-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.inner-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+t.dataset.page).classList.add('active');
    document.getElementById('crumb').textContent='执行记录';
  });
});

// ---- 数据（原型占位） ----
const CUR_USER='运营A'; // 后台当前操作人（开发期从登录态取）
// 测新清单数据：剧本（编号 script）与短剧两级；isNew=true 表示由 NEW_DRAMA_ONLINE 信号提醒进入（仅提醒，不自动触发测新）
const DRAMAS=[
  {id:'LA001',script:'替嫁新娘',name:'霸总的替嫁新娘',lang:'韩语',isNew:true},
  {id:'LA002',script:'都市医仙',name:'重生之都市医仙',lang:'英语',isNew:true},
  {id:'LA003',script:'小姨我爱你',name:'小姨我爱你',lang:'中文',isNew:true},
  {id:'LA004',script:'小娇妻马甲',name:'小娇妻马甲藏不住了',lang:'韩语'},
  {id:'LA005',script:'闪婚老公',name:'闪婚老公是大佬',lang:'韩语'},
  {id:'LA006',script:'天才萌宝',name:'天才萌宝找上门',lang:'泰语'},
  {id:'LA007',script:'替身白月光',name:'总裁的替身白月光',lang:'英语'},
  {id:'LA008',script:'落日余晖',name:'落日余晖下的吻',lang:'英语'},
  {id:'LA009',script:'国色天香',name:'国色天香',lang:'韩语'},
  {id:'LA010',script:'逆光而行',name:'逆光而行',lang:'英语'},
  {id:'LA011',script:'宠妃升职记',name:'宠妃升职记',lang:'韩语'},
  {id:'LA012',script:'至尊龙婿',name:'至尊龙婿',lang:'中文'},
  {id:'LA013',script:'甜妻上门',name:'甜妻上门',lang:'英语'},
  {id:'LA014',script:'隐婚妻子',name:'大佬的隐婚妻子',lang:'韩语'},
  {id:'LA015',script:'团宠',name:'重生的我成了团宠',lang:'泰语'},
  {id:'LA016',script:'前夫',name:'前夫请走开',lang:'英语'},
  {id:'LA017',script:'宠妻',name:'将军的宠妻',lang:'中文'},
  {id:'LA018',script:'医妃天下',name:'医妃天下',lang:'马来语'},
  {id:'LA019',script:'迷人娇妻',name:'娇妻太迷人',lang:'韩语'},
  {id:'LA020',script:'开局一个碗',name:'开局一个碗',lang:'英语'},
  {id:'LA021',script:'林深时见鹿',name:'林深时见鹿',lang:'中文'},
  {id:'LA022',script:'重生白月光',name:'白月光她重生归来',lang:'韩语'},
  {id:'LA023',script:'隐婚总裁',name:'隐婚总裁夜夜求撩',lang:'英语'},
  {id:'LA024',script:'福气农家',name:'穿越之福气农家',lang:'泰语'},
  {id:'LA025',script:'腹黑王爷',name:'腹黑王爷宠上瘾',lang:'中文'},
];
// 从 Meta / TikTok 两个自动化任务系统拉取的自动化任务（外部系统数据，开发期经 API 拉取）
const META_TASKS=[
  {id:'meta_kr_test',name:'韩语测新（Meta）'},
  {id:'meta_en_test',name:'英语测新（Meta）'},
  {id:'meta_zh_test',name:'中文测新（Meta）'},
  {id:'meta_th_test',name:'泰语测新（Meta）'},
  {id:'meta_kr_follow',name:'韩语跟投（Meta）'},
  {id:'meta_en_follow',name:'英语跟投（Meta）'},
  {id:'meta_my_follow',name:'马来语跟投（Meta）'},
];
const TT_TASKS=[
  {id:'tt_kr_test',name:'韩语测新（TikTok）'},
  {id:'tt_en_test',name:'英语测新（TikTok）'},
  {id:'tt_zh_test',name:'中文测新（TikTok）'},
  {id:'tt_th_test',name:'泰语测新（TikTok）'},
  {id:'tt_kr_follow',name:'韩语跟投（TikTok）'},
  {id:'tt_en_follow',name:'英语跟投（TikTok）'},
  {id:'tt_my_follow',name:'马来语跟投（TikTok）'},
];
// 测新默认自动化任务（第一期仅测新）：语种 → Meta / TikTok 各绑一条外部自动化任务，按当前操作人维护
const LANGS=['中文','英语','韩语','泰语','马来语'];
const bindings={
  '测新-韩语':{meta:'meta_kr_test',tt:'tt_kr_test'},
  '测新-英语':{meta:'meta_en_test',tt:'tt_en_test'},
};
let editingLang=''; // 编辑态：默认自动化任务弹窗当前编辑的语种（空=新增）
function taskList(platform){return platform==='meta'?META_TASKS:TT_TASKS;}
function nameById(platform,id){
  const t=taskList(platform).find(x=>x.id===id);
  return t?t.name:id;
}
// 执行记录：编排动作留痕（测新/跟投），只读；run 取自动化任务运行状态（无任务时展示跳过原因）
const RECORDS=[
  {id:'sg_20260814_1432_01',type:'跟投',dim:'短剧',target:'LA001 霸总的替嫁新娘',taskId:'meta_kr_follow / tt_kr_follow',user:'系统',run:'启动',time:'2026-08-14 14:32'},
  {id:'sg_20260814_1430_07',type:'跟投',dim:'素材',target:'003_Shuer_QT_EN',taskId:'meta_en_follow / tt_en_follow',user:'系统',run:'启动',time:'2026-08-14 14:30'},

// ---- 搜索下拉组件（绑定自动化任务）----
function ssHTML(platform, selId, role, key){
  const selName=selId?nameById(platform,selId):'';
  const attrs=(key?' data-key="'+key+'"':'')+(role?' data-role="'+role+'"':'');
  return '<div class="ss-wrap" data-plat="'+platform+'" data-sel="'+(selId||'')+'"'+attrs+'>'
    +'<input class="ss-input" placeholder="搜索 / 选择 '+(platform==='meta'?'Meta':'TikTok')+' 任务…" autocomplete="off" value="'+selName+'">'
    +'<div class="ss-list">'
      +'<div class="ss-opt'+(selId?'':' cur')+'" data-val="" data-search="未配置">未配置</div>'
      +taskList(platform).map(t=>'<div class="ss-opt'+(t.id===selId?' cur':'')+'" data-val="'+t.id+'" data-search="'+t.id+' '+t.name+'">'+t.name+'</div>').join('')
    +'</div></div>';
}
// 事件委托：搜索 / 展开 / 选择（对页面内所有 .ss-wrap 生效）
document.addEventListener('input',e=>{
  const inp=e.target.closest('.ss-input');
  if(!inp)return;
  const kw=inp.value.trim().toLowerCase();
  [...inp.nextElementSibling.querySelectorAll('.ss-opt')].forEach(o=>{
    o.hidden=kw?!o.dataset.search.toLowerCase().includes(kw):false;
  });
});
document.addEventListener('click',e=>{
  const inp=e.target.closest('.ss-input');
  if(inp){
    const wrap=inp.closest('.ss-wrap');
    document.querySelectorAll('.ss-wrap').forEach(w=>w!==wrap&&w.classList.remove('ss-open'));
    wrap.classList.toggle('ss-open');
    inp.value=wrap.dataset.sel?nameById(wrap.dataset.plat,wrap.dataset.sel):'';
    [...inp.nextElementSibling.querySelectorAll('.ss-opt')].forEach(o=>{o.hidden=false;});
    return;
  }
  if(!e.target.closest('.ss-list'))document.querySelectorAll('.ss-wrap').forEach(w=>w.classList.remove('ss-open'));
});
document.addEventListener('mousedown',e=>{
  const opt=e.target.closest('.ss-opt');
  if(!opt)return;
  e.preventDefault(); // 避免触发 input 的 blur
  const wrap=opt.closest('.ss-wrap');
  const val=opt.dataset.val;
  wrap.dataset.sel=val;
  wrap.querySelector('.ss-input').value=val?opt.textContent:'';
  wrap.classList.remove('ss-open');
  if(wrap.dataset.key)setBind(wrap.dataset.key,wrap.dataset.plat,val);
});

// ---- 默认自动化任务：正交全表 + 内联搜索下拉（无需弹窗）----
function setBind(key,platform,val){
  const b=bindings[key]||{meta:'',tt:''};
  b[platform]=val;
  bindings[key]=b;
}
function rerenderTaskTable(){
  const tb=document.getElementById('taskTable');
  tb.innerHTML='';
  for(const lang of LANGS){
    const b=bindings['测新-'+lang];
    if(!b)continue; // 仅展示当前操作人已配置的条目；列表只读，改绑=删除后重新新增
    tb.insertAdjacentHTML('beforeend',
      '<tr><td>'+lang+'</td>'
      +'<td>'+(nameById('meta',b.meta||'')||'未配置')+'</td>'
      +'<td>'+(nameById('tt',b.tt||'')||'未配置')+'</td>'
      +'<td><button class="btn" onclick="editTask(\''+lang+'\')">编辑</button> <button class="btn danger" onclick="removeTask(\''+lang+'\')">删除</button></td></tr>');
  }
}
function openAddTask(){
  editingLang='';
  document.getElementById('taskModalTitle').textContent='新增测新默认配置';
  document.getElementById('addLang').innerHTML='<option value="">请选择语种</option>'+LANGS.map(l=>'<option>'+l+'</option>').join('');
  document.getElementById('addMeta').innerHTML=ssHTML('meta');
  document.getElementById('addTT').innerHTML=ssHTML('tt');
  document.getElementById('taskMask').classList.add('show');
}
function editTask(lang){
  const b=bindings['测新-'+lang]||{meta:'',tt:''};
  editingLang=lang;
  document.getElementById('taskModalTitle').textContent='编辑测新默认配置';
  document.getElementById('addLang').innerHTML='<option>'+lang+'</option>'; // 编辑仅改任务绑定，语种固定
  document.getElementById('addMeta').innerHTML=ssHTML('meta',b.meta);
  document.getElementById('addTT').innerHTML=ssHTML('tt',b.tt);
  document.getElementById('taskMask').classList.add('show');
}
function closeAddTask(){
  editingLang='';
  document.getElementById('taskMask').classList.remove('show');
}
function confirmAddTask(){
  const lang=editingLang||document.getElementById('addLang').value;
  if(!lang){alert('请选择语种');return;}
  if(!editingLang&&bindings['测新-'+lang]){alert('该语种已配置测新默认任务，禁止重复新增');return;}
  const meta=document.querySelector('#addMeta .ss-wrap').dataset.sel||'';
  const tt=document.querySelector('#addTT .ss-wrap').dataset.sel||'';
  if(!meta&&!tt){alert('请至少为一个平台绑定自动化任务');return;}
  bindings['测新-'+lang]={meta:meta,tt:tt};
  editingLang='';
  document.getElementById('taskMask').classList.remove('show');
  rerenderTaskTable();
}
function removeTask(lang){
  const key='测新-'+lang;
  if(!confirm('删除「'+lang+'」测新默认配置？删除后该语种测新将跳过并告警。'))return;
  delete bindings[key];
  rerenderTaskTable();
}

// ---- 测新清单：勾选短剧批量发起测新（NEW_DRAMA_ONLINE 仅提醒，测新由用户发起）----
const dramaTest={LA007:'passed',LA006:'passed'}; // 历史已通过测新的短剧（不可重复发起）
let drPage=1, drPageSize=10, drPages=1;
function updateDrSelCount(){
  document.getElementById('drSelCount').textContent=[...document.querySelectorAll('#drTable .dr-checkbox')].filter(c=>c.checked).length;
}
function drPrev(){if(drPage>1){drPage--;renderDramaTable();}}
function drNext(){if(drPage<drPages){drPage++;renderDramaTable();}}
function setDrPageSize(v){drPageSize=+v;drPage=1;renderDramaTable();}
function updateDrPager(total){
  drPages=Math.max(1,Math.ceil(total/drPageSize));
  document.getElementById('drPagerInfo').textContent='共 '+total+' 部 · 第 '+drPage+'/'+drPages+' 页';
  document.getElementById('drPrev').disabled=drPage<=1;
  document.getElementById('drNext').disabled=drPage>=drPages;
}
function renderDramaTable(){
  const lang=document.getElementById('drLang').value;
  const kw=(document.getElementById('drKw').value||'').trim().toLowerCase();
  const list=DRAMAS.filter(d=>(!lang||d.lang===lang)&&(!kw||(d.id+' '+d.script+' '+d.name).toLowerCase().includes(kw)));
  const total=list.length;
  if(drPage>Math.max(1,Math.ceil(total/drPageSize)))drPage=1;
  const slice=list.slice((drPage-1)*drPageSize,drPage*drPageSize);
  const tb=document.getElementById('drTable');
  tb.innerHTML='';
  slice.forEach(d=>{
    const dis=dramaTest[d.id]==='passed'; // 已通过不可重复发起
    tb.insertAdjacentHTML('beforeend',
      '<tr data-drama="'+d.id+'">'
      +'<td><input type="checkbox" class="dr-checkbox" data-id="'+d.id+'"'+(dis?' disabled title="已通过测新"':'')+'></td>'
      +'<td>'+d.id+'</td>'
      +'<td>'+d.script+'</td>'
      +'<td>'+d.name+'</td>'
      +'<td>'+d.lang+'</td>'
      +'<td>'+(d.isNew?'<span class="tag tag-blue">新上线</span>':'<span class="tag tag-gray">已上线</span>')+'</td></tr>');
  });
  updateDrSelCount();
  updateDrPager(total);
}
document.querySelector('.dr-checkbox-all').addEventListener('change',e=>{
  [...document.querySelectorAll('#drTable .dr-checkbox')].forEach(c=>{c.checked=e.target.checked&&!c.disabled;});
  updateDrSelCount();
});
document.getElementById('drTable').addEventListener('change',e=>{
  if(e.target.classList.contains('dr-checkbox'))updateDrSelCount();
});
function batchInitiateTest(){
  const sel=[...document.querySelectorAll('#drTable .dr-checkbox')].filter(c=>c.checked&&!c.disabled);
  if(!sel.length){alert('请先勾选要发起测新的短剧');return;}
  batchSel=sel.map(cb=>DRAMAS.find(x=>x.id===cb.dataset.id)).filter(Boolean);
  document.getElementById('detailCount').textContent=batchSel.length;
  document.getElementById('detailDramas').textContent=batchSel.map(d=>d.id+' '+d.name).join('、');
  document.getElementById('detailTasks').innerHTML=taskGridHTML();
  document.getElementById('detailMask').classList.add('show');
}

// ---- 测新确认弹窗：批量确认（默认配置列表 + 统一排期），确认后绑定并进入执行记录 ----
let batchSel=[], recSeq=1;
function taskGridHTML(){
  const scenes=['测新'], langs=LANGS;
  let html='<table><thead><tr><th>场景</th><th>语种</th><th>绑定 Meta 任务</th><th>绑定 TikTok 任务</th></tr></thead><tbody>';
  for(const scene of scenes) for(const lang of langs){
    const b=bindings[scene+'-'+lang]||{meta:'',tt:''};
    html+='<tr><td>'+scene+'</td><td>'+lang+'</td>'
      +'<td>'+(b.meta?nameById('meta',b.meta):'<span class="cell-muted">未配置</span>')+'</td>'
      +'<td>'+(b.tt?nameById('tt',b.tt):'<span class="cell-muted">未配置</span>')+'</td></tr>';
  }
  return html+'</tbody></table>';
}
function cancelBatch(){batchSel=[];document.getElementById('detailMask').classList.remove('show');}
function confirmBatch(){
  if(!batchSel.length)return;
  const schedule=(document.getElementById('detailSchedule').value||'').replace('T',' ')||'立即';
  let skip=0;
  batchSel.forEach(d=>{
    if(!bindings['测新-'+d.lang]){skip++;return;} // 该语种未配置默认自动化任务：跳过并告警
    dramaTest[d.id]='passed';
    prependRecord(d,schedule); // 开发期：分别调用 Meta / TikTok 自动化任务系统绑定短剧
  });
  batchSel=[];
  document.getElementById('detailMask').classList.remove('show');
  if(skip)alert(skip+' 部短剧该语种未配置默认自动化任务，已跳过');
  switchToRecords();
}
function prependRecord(d,schedule){
  const b=bindings['测新-'+d.lang];
  RECORDS.unshift({
    id:'sg_manual_'+String(recSeq++).padStart(3,'0'),
    type:'测新',dim:'短剧',target:d.id+' '+d.name,
    taskId:b.meta+' / '+b.tt,user:CUR_USER,run:'启动',time:schedule,
  });
  renderRecords();
}
function runCell(run){
  if(run==='启动')return '<span class="st"><span class="st-dot s-ok"></span><span class="st-txt s-ok">启动</span></span>';
  if(run==='暂停')return '<span class="st"><span class="st-dot s-pause"></span><span class="st-txt s-pause">暂停</span></span>';
  return '<span class="cell-muted">'+run+'</span>';
}
function renderRecords(){
  const type=document.getElementById('recType').value;
  const dim=document.getElementById('recDim').value;
  const user=document.getElementById('recUser').value;
  const kw=(document.getElementById('recKw').value||'').trim().toLowerCase();
  const d1=document.getElementById('recDate1').value;
  const d2=document.getElementById('recDate2').value;
  const list=RECORDS.filter(r=>
    (!type||r.type===type)&&(!dim||r.dim===dim)&&(!user||r.user===user)
    &&(!kw||(r.target+' '+r.taskId).toLowerCase().includes(kw))
    &&(!d1||r.time.slice(0,10)>=d1)&&(!d2||r.time.slice(0,10)<=d2));
  const tb=document.getElementById('recTableBody');
  tb.innerHTML=list.map(r=>
    '<tr><td>'+r.id+'</td>'
    +'<td><span class="tag '+(r.type==='测新'?'tag-green':'tag-blue')+'">'+r.type+'</span></td>'
    +'<td>'+r.dim+'</td><td>'+r.target+'</td>'
    +'<td>'+r.taskId+'</td><td>'+r.user+'</td>'
    +'<td>'+runCell(r.run)+'</td><td>'+r.time+'</td></tr>').join('');
}
function resetRecords(){
  ['recType','recDim','recKw','recUser','recDate1','recDate2'].forEach(id=>{document.getElementById(id).value='';});
  renderRecords();
}
function switchToRecords(){
  switchOuter('dashboard');
  document.querySelectorAll('.inner-tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('.inner-tab[data-page="records"]').classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-records').classList.add('active');
  document.getElementById('crumb').textContent='执行记录';
}

// ---- 初始化 ----
renderDramaTable();
rerenderTaskTable();
renderRecords();
</script>
